<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>James's Wedding RSVP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Playfair+Display:wght@400;500&family=Montserrat:wght@400;500;600&display=swap">
<style>
/* Layout: one centred stationery column; names in script up top, a single soft card that changes per step. */
:root{
  --paper:#f5f3ef; --card:#ede8e2; --line:#b9b0a8; --rule:#2b2623;
  --ink:#2b2623; --muted:#6a5e58; --taupe:#806c64; --taupe-dark:#6a5850; --field:#ffffff; --error:#9a3b2e;
  --script:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Montserrat","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;padding-block:40px 64px;padding-inline:16px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:36px}
header{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0}
.names{font-family:var(--script);font-weight:400;font-size:clamp(46px,11vw,72px);line-height:1.1;color:var(--taupe);margin:0;text-wrap:balance}
.orn{color:var(--taupe);width:150px;height:12px}
.rsvp{font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:.04em;color:var(--taupe);margin:14px 0 0}
.intro{margin:0;max-width:52ch;text-wrap:balance}
.card{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:32px clamp(18px,5vw,36px);display:flex;flex-direction:column;gap:20px}
.card h2{font-size:18px;font-weight:600;text-align:center;margin:0;text-wrap:balance;outline:none}
.sub{text-align:center;font-size:13.5px;margin:0;text-wrap:balance}
.count{text-align:center;font-size:12.5px;color:var(--muted);margin:0;font-variant-numeric:tabular-nums}
.event{text-align:center;display:flex;flex-direction:column;gap:4px}
.event h3{font-size:20px;font-weight:600;margin:0}
.event p{margin:0;font-size:13.5px}
.rows{display:flex;flex-direction:column}
.row{border-top:1px solid var(--rule);padding:18px 0;display:flex;flex-direction:column;gap:10px;min-width:0}
.rows .row:last-child{border-bottom:1px solid var(--rule)}
.row .who{font-weight:600;overflow-wrap:anywhere}
.choices{display:flex;flex-wrap:wrap;gap:8px 28px}
.choices label{display:flex;align-items:center;gap:10px;cursor:pointer}
input[type=radio]{width:20px;height:20px;accent-color:var(--taupe);margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:500;font-size:13.5px}
.inline{display:flex;gap:8px}
input[type=text],textarea{width:100%;min-width:0;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
textarea{min-height:96px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
button{font:inherit;cursor:pointer;border-radius:999px;padding:9px 30px;border:1px solid var(--taupe)}
.primary{background:var(--taupe);color:#fff;font-size:16px;min-width:180px}
.primary:hover{background:var(--taupe-dark)}
.ghost{background:var(--field);color:var(--taupe-dark)}
.link{background:none;border:none;padding:4px 0;color:var(--taupe-dark);text-decoration:underline;border-radius:4px;align-self:flex-start}
.remove{padding:0 14px;background:var(--field);color:var(--muted);border-color:var(--line)}
:focus-visible{outline:2px solid var(--taupe-dark);outline-offset:2px}
.error{color:var(--error);text-align:center;font-size:13.5px;margin:0;font-weight:500}
.summary{display:flex;flex-direction:column}
.summary .row{gap:4px}
.summary ul{margin:0;padding-left:18px;font-size:13.5px}
.notice{font-size:12.5px;color:var(--muted);text-align:center;margin:0}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow">The wedding of</p>
    <h1 class="names" id="names"></h1>
    <svg class="orn" viewBox="0 0 150 12" aria-hidden="true"><path d="M8 6H142" stroke="currentColor" stroke-width="1" fill="none"/><circle cx="6" cy="6" r="2.2" fill="currentColor"/><circle cx="144" cy="6" r="2.2" fill="currentColor"/><path d="M75 1.5 79.5 6 75 10.5 70.5 6Z" fill="currentColor"/></svg>
    <p class="rsvp">RSVP</p>
    <p class="intro" id="intro"></p>
  </header>
  <main class="card" id="card" aria-live="polite"></main>
</div>

<script>
/* ---------- Everything you'd edit lives here ---------- */
const CONFIG = {
  couple: "James & Ammu",
  intro: "We would love to celebrate with you. Please let us know which events you can join.",
  events: [
    { name: "Engagement",             details: "Thursday, 31 December 2026 at 12:00 pm \u2014 Pallikkunnu Road, Punnathura West, Kerala 686631, India", note: "" },
    { name: "Engagement Reception",   details: "Thursday, 31 December 2026 \u2014 MH62+926, SH 1, Ettumanoor, Kerala 686562, India", note: "" },
    { name: "Wedding",                details: "Sunday, 3 January 2027 at 2:30 pm \u2014 Muthalakodam Church, Muthalakodam, Thodupuzha, Idukki district, Kerala, India", note: "" },
    { name: "Wedding After Party",    details: "Sunday, 3 January 2027 at 5:00 pm \u2014 JDMX Park Villa Auditorium Hall, Njarukutty, Thodupuzha, 685605, Idukki district, Kerala, India", note: "" }
  ],
  // Filled in once the Google Form exists; while empty the page runs as a preview and saves nothing.
  googleForm: {
    action: "https://docs.google.com/forms/d/e/1FAIpQLScG3wOeUK5Zx7W70AYaeNOnZThociL4ClNdUSTBFwCB13t1dA/formResponse",
    fields: {
      name: "entry.1129604200",
      events: ["entry.834954944", "entry.667150987", "entry.1975944346", "entry.836486921"],
      allergies: "entry.86251581"
    }
  }
};

const state = { step: 0, guests: [""], answers: CONFIG.events.map(() => ({})), diet: {}, message: "", error: "" };
const card = document.getElementById("card");
const N = CONFIG.events.length;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const names = () => state.guests.map(g => g.trim()).filter(Boolean);
const attendingAny = i => state.answers.some(a => a[i] === "yes");

document.getElementById("names").textContent = CONFIG.couple;
document.getElementById("intro").textContent = CONFIG.intro;

function render(focus) {
  const s = state.step, err = state.error ? `<p class="error" role="alert">${esc(state.error)}</p>` : "";
  let h = "";
  if (s === 0) {
    h = `<h2 tabindex="-1">Who are you replying for?</h2>
      <p class="sub">Enter your first and last name. If you're replying for a partner or your family, add each person and you can answer for everyone on the next pages.</p>
      <div class="rows" style="gap:12px">` +
      state.guests.map((g, i) => `<div class="field"><label for="guest-${i}">${i ? "Guest " + (i + 1) : "Your name"}</label>
        <div class="inline"><input type="text" id="guest-${i}" data-guest="${i}" value="${esc(g)}" autocomplete="${i ? "off" : "name"}" placeholder="First and last name">
        ${i ? `<button type="button" class="remove" data-remove="${i}" aria-label="Remove guest ${i + 1}">&times;</button>` : ""}</div></div>`).join("") +
      `</div><button type="button" class="link" id="add-guest">+ Add another person</button>${err}
      <div class="actions"><button type="button" class="primary" id="next">Continue</button></div>`;
  } else if (s <= N) {
    const e = CONFIG.events[s - 1], a = state.answers[s - 1];
    h = `<p class="count">${s} of ${N} events</p>
      <div class="event"><h3 tabindex="-1">${esc(e.name)}</h3><p>${esc(e.details)}</p>${e.note ? `<p><strong>Note to guest:</strong> ${esc(e.note)}</p>` : ""}</div>
      <div class="rows">` +
      names().map((n, i) => `<div class="row" role="group" aria-label="${esc(n)}"><span class="who">${esc(n)}</span><div class="choices">
        <label><input type="radio" id="e${s}-g${i}-yes" name="e${s}-g${i}" data-g="${i}" value="yes" ${a[i] === "yes" ? "checked" : ""}> Will Attend</label>
        <label><input type="radio" id="e${s}-g${i}-no" name="e${s}-g${i}" data-g="${i}" value="no" ${a[i] === "no" ? "checked" : ""}> Will Not Attend</label></div></div>`).join("") +
      `</div>${err}<div class="actions"><button type="button" class="ghost" id="prev">Previous</button><button type="button" class="primary" id="next">${s === N ? "Continue" : "Next Event"}</button></div>`;
  } else if (s === N + 1) {
    const going = names().map((n, i) => [n, i]).filter(([, i]) => attendingAny(i));
    h = `<h2 tabindex="-1">${going.length ? "Allergies" : "Send your reply"}</h2>` +
      (going.length ? `<p class="sub">Please tell us about any allergies. Leave blank if there are none.</p>` +
        going.map(([n, i]) => `<div class="field"><label for="diet-${i}">${esc(n)}</label><input type="text" id="diet-${i}" data-diet="${i}" value="${esc(state.diet[i] || "")}" placeholder="None"></div>`).join("") : `<p class="sub">We're sorry you can't make it. Send your reply so we know.</p>`) +
      `${err}
      <div class="actions"><button type="button" class="ghost" id="prev">Previous</button><button type="button" class="primary" id="next">Send RSVP</button></div>`;
  } else {
    h = `<h2 tabindex="-1">Thank you</h2><p class="sub">Here is what we have for your group.</p><div class="summary rows">` +
      names().map((n, i) => {
        const yes = CONFIG.events.filter((_, k) => state.answers[k][i] === "yes").map(e => `<li>${esc(e.name)}</li>`).join("");
        return `<div class="row"><span class="who">${esc(n)}</span>${yes ? `<ul>${yes}</ul>` : `<span class="hint">Not able to attend</span>`}</div>`;
      }).join("") + `</div>` +
      (CONFIG.googleForm.fields.name ? "" : `<p class="notice">Preview only. Replies are not being saved yet.</p>`) +
      `<div class="actions"><button type="button" class="ghost" id="edit">Change my answers</button></div>`;
  }
  card.innerHTML = h;
  if (focus) { const t = card.querySelector("[tabindex='-1']"); if (t) t.focus(); }
}

function go(step) { state.step = step; state.error = ""; render(true); }

function next() {
  const s = state.step;
  if (s === 0) {
    if (!state.guests[0].trim()) { state.error = "Please enter your name to continue."; return render(); }
    state.guests = names();
    return go(1);
  }
  if (s <= N) {
    const a = state.answers[s - 1];
    if (names().some((_, i) => !a[i])) { state.error = "Please choose an answer for each person."; return render(); }
    return go(s + 1);
  }
  send();
}

async function send() {
  const gf = CONFIG.googleForm;
  if (gf.fields.name) {
    // One Google Form response per guest, so each person gets their own row in the Sheet.
    try {
      await Promise.all(names().map((n, i) => {
        const d = new URLSearchParams();
        d.append(gf.fields.name, n);
        CONFIG.events.forEach((_, k) => d.append(gf.fields.events[k], state.answers[k][i] === "yes" ? "Will Attend" : "Will Not Attend"));
        d.append(gf.fields.allergies, state.diet[i] || "");
        return fetch(gf.action, { method: "POST", mode: "no-cors", body: d });
      }));
    } catch (e) { state.error = "We couldn't send your reply. Check your connection and try again."; return render(); }
  }
  go(N + 2);
}

card.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.guest !== undefined) state.guests[+t.dataset.guest] = t.value;
  else if (t.dataset.diet !== undefined) state.diet[+t.dataset.diet] = t.value;
  else if (t.id === "message") state.message = t.value;
});
card.addEventListener("change", e => {
  const t = e.target;
  if (t.type === "radio") state.answers[state.step - 1][+t.dataset.g] = t.value;
});
card.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.id === "next") next();
  else if (t.id === "prev") go(state.step - 1);
  else if (t.id === "edit") go(0);
  else if (t.id === "add-guest") { state.guests.push(""); state.error = ""; render(); document.getElementById("guest-" + (state.guests.length - 1)).focus(); }
  else if (t.dataset.remove !== undefined) {
    const i = +t.dataset.remove;
    state.guests.splice(i, 1);
    state.answers.forEach(a => { for (let k = i; k < state.guests.length + 1; k++) { if (a[k + 1] !== undefined) a[k] = a[k + 1]; else delete a[k]; } });
    render();
  }
});
card.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.type === "text") { e.preventDefault(); next(); } });

render();
</script>
</body>
</html>
